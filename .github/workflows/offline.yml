name: Offline verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.13'
      - run: uv sync --locked --python 3.12
      - run: uv run pytest -q --junitxml=test-results.xml
      - run: uv build --wheel
      - run: uv run python scripts/wheel_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}
          path: test-results.xml
