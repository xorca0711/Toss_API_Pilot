[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toss-pilot"
version = "0.3.0"
description = "Pilot client for the Toss Securities Open API (openapi.tossinvest.com)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
toss-pilot = "toss_pilot.cli:main"
toss-research = "toss_pilot.research.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/toss_pilot"]

[tool.hatch.build.targets.wheel.force-include]
"config/api.json" = "toss_pilot/data/api.json"
"config/research.json" = "toss_pilot/data/research.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
